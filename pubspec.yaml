name: nextfind
description: "A simple way to find local businesess you'll love"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter



  cached_network_image: ^3.3.1
  logger: ^2.0.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  maplibre_gl: 0.26.2
  device_info_plus: ^9.1.2
  flutter_secure_storage: ^10.0.0
  geolocator: ^10.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
          weight: 400
