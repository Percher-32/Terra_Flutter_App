name: nextfind
description: "A simple way to find local businesess you'll love"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  rapidfuzz: ^0.1.0
  connectivity_plus: ^6.0.0
  # cached_network_image: ^3.3.1
  cached_network_image: ^3.3.1
  flutter_riverpod: ^2.5.1
  logger: ^2.0.2
  flutter_map: ^6.0.0
  vector_map_tiles: ^7.3.1
  latlong2: ^0.9.0
  
  maplibre_gl: 0.26.2
  device_info_plus: ^9.1.2
  flutter_secure_storage: ^10.0.0
  geolocator: ^10.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:


    - assets/icons/business_icons/
    - assets/icons/business_icons/distance_icon.png
    - assets/icons/business_icons/rating_star.png
    - assets/icons/business_icons/unverified_badge_mini.png
    - assets/icons/business_icons/unverified_badge.png

    - assets/img/
    - assets/icons/business_type_icons/
    
    - assets/icons/business_type_icons/food_and_dining_icon.png
    - assets/icons/business_type_icons/home_services_icon.png
    - assets/icons/business_type_icons/health_and_wellness_icon.png
    - assets/icons/business_type_icons/shopping_and_retail_icon.png
    - assets/icons/business_type_icons/shopping_and_retail_icon.png
    - assets/icons/business_type_icons/automotive_icon.png
    - assets/icons/business_type_icons/beauty_and_personal_care_icon.png
    - assets/icons/business_type_icons/entertainment_and_leisure_icon.png
    - assets/icons/business_type_icons/education_icon.png
    - assets/icons/business_type_icons/lodging_and_travel_icon.png


    
    - assets/icons/business_type_icons/food_and_dining_icon_alt.png
    - assets/icons/business_type_icons/home_services_icon_alt.png
    - assets/icons/business_type_icons/health_and_wellness_icon_alt.png
    - assets/icons/business_type_icons/shopping_and_retail_icon_alt.png
    - assets/icons/business_type_icons/shopping_and_retail_icon_alt.png
    - assets/icons/business_type_icons/automotive_icon_alt.png
    - assets/icons/business_type_icons/beauty_and_personal_care_icon_alt.png
    - assets/icons/business_type_icons/entertainment_and_leisure_icon_alt.png
    - assets/icons/business_type_icons/education_icon_alt.png
    - assets/icons/business_type_icons/lodging_and_travel_icon_alt.png
    
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
          weight: 400
